server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Any localhost port (ng serve uses 4200+) works out of the box; a
            # real deployment overrides this with its own origin(s), e.g.
            #   CORS_ALLOWED_ORIGIN_PATTERNS=https://demo.example.com
            # allowedOriginPatterns (not allowedOrigins) is required because
            # allowCredentials is true — the literal "*" is illegal in
            # allowedOrigins when credentials are enabled.
            #
            # Pinning this to hardcoded origins breaks every deployment that is
            # not a browser on this machine: browsers send Origin even on
            # same-origin POSTs, so login fails with 403 while curl succeeds.
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**,/api/business/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: admin-routes
          uri: lb://auth-service
          predicates:
            - Path=/api/admin/**
